<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafeteria DAW</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1>Café DAW</h1>
        <nav class="menu">
                <a href="#index">Inicio</a>
                <a href="#">Productos</a>
                <a href="#formulario">Contacto</a>
        </nav>
        <!-- iNSERTAMOS LAS SECCIONES QUE QUEREMOS TENER EN NUESTRA WEB-->
         <section class="banner">
            <img src="img/banner.jpg" alt="Cafe">
            <h2>El mejor cafe de desarrollo de toda la UEM</h2>
         </section>
         <section class="productos">
            <div class="card">
                <img src="img/cafe.jpg" alt="">
                <h3>Expresso</h3>
                <p>PVP: 2,50€</p>
            </div>
              <div class="card">
                <img src="img/capuccino.jpg" alt="">
                <h3>Capuccino</h3>
                <p>PVP: 3,50€</p>
            </div>
              <div class="card">
                <img src="img/latte.jpg" alt="">
                <h3>Cafe Latte</h3>
                <p>PVP: 2€ </p>
            </div>
         </section>
         <footer class="footer">
            @ 1 DAW Materia lenguaje de Marcas y Sistemas de Gestion
         </footer>
    </header>
</body>
</html>
